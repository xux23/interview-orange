<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>面试橙</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!-- 透明浮窗补丁：#overlay 窗口在 CSS/JS 加载前就置透明类，避免首帧实心块残留（原版同款问题） -->
    <script>
      if (location.hash.indexOf('#overlay') === 0) {
        document.documentElement.className = 'overlay';
      }
    </script>
    <style>
      html.overlay, html.overlay body { background: transparent !important; }
    </style>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
